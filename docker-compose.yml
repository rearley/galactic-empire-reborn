services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ge
      POSTGRES_PASSWORD: ge
      POSTGRES_DB: ge
    volumes:
      - ge_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ge"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ge_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://ge:ge@postgres:5432/ge?schema=public
      # Override JWT_SECRET in production: JWT_SECRET=<long-random-string> docker compose up
      JWT_SECRET: dev-change-me-in-production
      PGHOST: postgres
      PGUSER: ge
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - ge_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - ge_net

networks:
  ge_net:
    driver: bridge

volumes:
  ge_pgdata:
