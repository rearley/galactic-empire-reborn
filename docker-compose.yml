services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ge
      POSTGRES_PASSWORD: ge
      POSTGRES_DB: ge
    volumes:
      - ge_pgdata:/var/lib/postgresql/data
      - ./docker/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ge"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  ge_pgdata:
