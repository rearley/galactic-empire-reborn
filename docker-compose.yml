services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ge
      POSTGRES_PASSWORD: ge
      POSTGRES_DB: ge
    volumes:
      - ge_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ge"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - ge_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://ge:ge@postgres:5432/ge?schema=public
      # Required, no default on purpose. auth.module.ts throws when it is absent,
      # but a default here means it is never absent — so the guard never fires
      # and a shipped placeholder signs real player tokens. Compose fails with
      # "variable is not set" instead, which is the point.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set — generate one with `openssl rand -base64 48`}
      # Set to point at a mounted tuning file; without it the resolver derives
      # the path from the image layout. @see docs/DECISIONS.md 2026-09-07
      # GE_CONFIG_PATH: /config/game.config.json
      PGHOST: postgres
      PGUSER: ge
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    # Warn players before watchtower stops this container.
    #
    # Watchtower runs the pre-update command IN the container and WAITS for it,
    # which is what buys the 45-second countdown — it is the only point in the
    # pipeline that knows the restart is actually happening. The CI job only
    # knows an image was published, so it can say no more than "5 to 10 minutes".
    #
    # The timeout is in MINUTES and the default is 60 SECONDS, too close to a
    # 45-second sleep plus node startup. Two gives room without letting a hung
    # hook hold a deploy for long — and a non-zero exit or a timeout does not
    # stop the update anyway.
    #
    # THESE LABELS DO NOTHING until the host's watchtower runs with
    # WATCHTOWER_LIFECYCLE_HOOKS=true, which is a change to shared
    # infrastructure. @see docs/DECISIONS.md 2026-09-20
    labels:
      com.centurylinklabs.watchtower.lifecycle.pre-update: "node /app/backend/scripts/deploy-warn.mjs"
      com.centurylinklabs.watchtower.lifecycle.pre-update-timeout: "2"
    networks:
      - ge_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - ge_net

networks:
  ge_net:
    driver: bridge

volumes:
  ge_pgdata:
