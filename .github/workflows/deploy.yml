name: Build and publish images

# Builds the backend and frontend images and pushes them to ghcr, where the
# Plesk host pulls them. A watchtower container on that host watches :latest,
# so a merge to master redeploys without anyone touching the server.
#
# Third-party actions are pinned to commit SHAs, not tags. This job holds
# packages:write against a registry the production host pulls from, and a tag
# like @v4 is mutable — whoever controls that action can repoint it, and the
# next build would push whatever they wanted into ghcr, where watchtower would
# deploy it within five minutes without anyone touching the server. The trailing
# comment keeps the human-readable version visible.
#
# This runs in Actions rather than from a developer's machine on purpose: the
# built-in GITHUB_TOKEN already carries packages:write, so nobody needs a
# personal token with that scope, and the images are always built from what is
# actually on master rather than from whatever happened to be in a working tree.

on:
  push:
    branches: [master]
    # Documentation must not restart a live game.
    #
    # GIT_SHA is a build arg baked into both images, so EVERY push produced a
    # new digest even when no code changed, watchtower saw a new :latest, and
    # the stack restarted. A docs-only commit therefore interrupted whoever was
    # playing — caught doing exactly that to a player mid-battle on 2026-09-09.
    #
    # Neither Dockerfile copies docs/, specs/ or any .md (backend takes
    # package*.json, prisma, tsconfig, nest-cli.json, src, config; frontend
    # takes package*.json, the config files, index.html, src, nginx.conf), so
    # nothing here can change what gets built.
    #
    # TRAP: if a .md ever becomes a build input — a guide page sourced from
    # markdown, say — this filter will silently skip a real deploy. Remove the
    # pattern rather than adding an exception, because a deploy that does not
    # happen looks exactly like one that did.
    #
    # VERSION is deliberately NOT here: it is read by this workflow and baked
    # in as APP_VERSION, so a bump must build.
    #
    # reference/ is deliberately NOT here either. It never reaches an image, but
    # a change to it is rare enough that an unnecessary build costs less than
    # reasoning about whether that one was the exception.
    #
    # Test directories are here for the same reason as docs: neither Dockerfile
    # copies them (backend takes package*.json, prisma, tsconfig, nest-cli.json,
    # src, config), so a test-only commit rebuilds a byte-identical image and
    # restarts the game for nothing. Coverage work makes many such commits.
    #
    # The two tools/ directories are not build inputs either. `tools/` holds the
    # canon extractors and `backend/tools/` the coverage classifier and one-off
    # backfills; all of them run on a developer's machine. Excluding them is safe
    # BECAUSE the extractors write their output into backend/src and
    # backend/prisma/seed, which are not ignored — so regenerating canon still
    # deploys, while editing the generator that produced it does not.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'specs/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'backend/test/**'
      - 'frontend/test/**'
      - 'frontend/e2e/**'
      - 'tools/**'
      - 'backend/tools/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      # Build both even if one fails, so a broken frontend does not hide a
      # broken backend and cost a second round trip to find out.
      fail-fast: false
      matrix:
        include:
          - name: ge-backend
            context: ./backend
          - name: ge-frontend
            context: ./frontend

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # The release number lives in one place, at the repo root, so both images
      # cannot disagree about what release they are.
      - name: Read VERSION
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          push: true
          # Baked into the image so the running app can say which commit it is.
          # Same value as the :sha tag below, so a version on screen names a
          # pullable image, which is what makes it useful for rolling back.
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.version.outputs.value }}
          # :latest is what watchtower follows; the sha tag is what makes a bad
          # deploy recoverable — pin the compose file to a sha to roll back.
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
