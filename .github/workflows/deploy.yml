name: Build and publish images

# Builds the backend and frontend images and pushes them to ghcr, where the
# Plesk host pulls them. A watchtower container on that host watches :latest,
# so a merge to master redeploys without anyone touching the server.
#
# This runs in Actions rather than from a developer's machine on purpose: the
# built-in GITHUB_TOKEN already carries packages:write, so nobody needs a
# personal token with that scope, and the images are always built from what is
# actually on master rather than from whatever happened to be in a working tree.

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      # Build both even if one fails, so a broken frontend does not hide a
      # broken backend and cost a second round trip to find out.
      fail-fast: false
      matrix:
        include:
          - name: ge-backend
            context: ./backend
          - name: ge-frontend
            context: ./frontend

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          # :latest is what watchtower follows; the sha tag is what makes a bad
          # deploy recoverable — pin the compose file to a sha to roll back.
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}:latest
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
