name: CI and deploy

# Tests, then images. One workflow, because the gate has to be real: the build
# job declares `needs` on both suites, so GitHub itself refuses to start it when
# a test fails. Nothing unproven can reach ghcr, and nothing unproven can reach
# the deploy host that pulls from it.
#
# This used to be two workflows and the split was the problem. deploy.yml
# triggered on its own `push`, so a red test run did not stop an image shipping.
# A `workflow_run` trigger would have gated it while losing the path rules
# below, because workflow_run cannot filter on paths.
#
# Images go to ghcr, where a watchtower container on the deploy host follows
# :latest — so a merge to master redeploys without anyone touching the server,
# usually within five minutes.
#
# TRIGGERS. `push` to master is the one that matters. Work here is committed
# straight to master rather than through feature branches, so a
# pull_request-only workflow would almost never run. On a pull request the
# suites run and the build does not.
#
# Documentation must not spend a CI run OR restart a live game. A docs-only
# push is filtered out here and never starts anything.
#
# TRAP: if a .md ever becomes a build input — a guide page sourced from
# markdown, say — remove the pattern rather than adding an exception. A deploy
# that does not happen looks exactly like one that did.
#
# VERSION is deliberately NOT ignored: it is read below and baked into both
# images, so a bump must build. reference/ is not ignored either — it never
# reaches an image, but a change to it is rare enough that an unnecessary build
# costs less than reasoning about whether this one was the exception.
on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'specs/**'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
  workflow_dispatch:

# A newer commit supersedes an in-flight run on the same ref. Cancelling is
# limited to pull requests on purpose: on master an in-flight run may be pushing
# images, and interrupting that is a worse outcome than one redundant run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default. The build job raises its own permissions to push images,
# so the two test jobs cannot write anything even if a dependency tried.
permissions:
  contents: read

# Third-party actions are pinned to commit SHAs, not tags. The build job holds
# packages:write against a registry the production host pulls from, and a tag
# like @v4 is mutable — whoever controls that action could repoint it, and the
# next build would push whatever they wanted into ghcr, where watchtower would
# deploy it within five minutes. The trailing comment keeps the human-readable
# version visible.

jobs:
  backend:
    name: Backend — Vitest
    runs-on: ubuntu-latest
    # 605 suites / 6,141 tests measured at 100s on a developer machine and 240s
    # on a hosted runner. This is headroom, not a prediction; it exists so a
    # hang costs minutes instead of the six-hour default.
    timeout-minutes: 20

    # The suite is not hermetic: it runs against a real PostgreSQL, because the
    # queries under test are real Prisma queries. 16 matches production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ge
          POSTGRES_PASSWORD: ge
          POSTGRES_DB: ge_test
        ports:
          - 5432:5432
        # Without a health check the first connection races container startup.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # test/prisma-schema/helpers/global-setup.ts refuses to start without
      # this, so a stray run can never truncate a development database.
      TEST_DATABASE_URL: postgresql://ge:ge@localhost:5432/ge_test
      # AuthModule throws at construction when this is unset, which would fail
      # every auth and gateway suite. Value is irrelevant; it signs nothing that
      # outlives the job.
      JWT_SECRET: ci-not-a-real-secret
      # Skips the two wall-clock performance budgets: 100 ships advancing in
      # under 50ms (test/game/physics/bench.spec.ts) and the midnight pass over
      # 1,000 users and 2,000 planets in under 5,000ms
      # (test/game/midnight/perf-budget.spec.ts).
      #
      # Both measure the machine they run on. A hosted runner is shared, and the
      # midnight budget sat close enough to its ceiling here that it would
      # eventually go red for a reason that says nothing about the code — which
      # teaches people to re-run a build until it passes. They still run
      # locally, where the number is comparable with the last time it was taken.
      CI_LOW_PERF: '1'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # 24 to match both Dockerfiles. Testing on a newer major than production
      # runs would let a runtime difference through in the direction that
      # matters least.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          # Points at the root lockfile, not backend/'s: `npm ci` run from
          # backend/ discovers the ancestor npm workspace declared at the repo
          # root and installs against ITS lockfile, not a per-app one — a
          # side effect of adding packages/wire in Phase 1. The two per-app
          # package-lock.json files were removed for the same reason; keeping
          # them around would have been actively misleading, since npm no
          # longer reads them.
          cache-dependency-path: package-lock.json

      # global-setup.ts shells out to `psql` for three LOWER() unique indexes
      # that Prisma cannot express in schema.prisma. An assumption that fails
      # silently three steps later is worse than one that fails here.
      - name: Verify psql is present
        run: psql --version

      - name: Install
        working-directory: backend
        run: npm ci

      # @ge/wire ships as a dual CJS/ESM build under packages/wire/dist. `npm
      # ci` only symlinks the workspace package into node_modules — it does
      # not build it — so nothing importing `@ge/wire` resolves at runtime
      # until this runs.
      - name: Build @ge/wire
        working-directory: backend
        run: npm run build --workspace @ge/wire

      # The contract's own suite. It runs HERE rather than in a third job
      # because it needs nothing this job has not already done, and because
      # the alternative was what shipped for the whole restructure: both jobs
      # built @ge/wire and neither checked it, so the one package whose change
      # breaks two applications at once was the only one with no gate.
      - name: Test @ge/wire
        working-directory: backend
        run: npm test --workspace @ge/wire

      # DATABASE_URL is scoped to this step and is a placeholder. `prisma
      # generate` never opens a connection — it reads the schema and writes
      # TypeScript — but prisma.config.ts resolves the variable eagerly and
      # fails loudly when it is unset, which is the behaviour wanted everywhere
      # else. The suite connects through TEST_DATABASE_URL in the job env above.
      - name: Generate Prisma client
        working-directory: backend
        env:
          DATABASE_URL: postgresql://generate-only:generate-only@127.0.0.1:1/generate-only
        run: npx prisma generate

      # Vitest transpiles per file and does not type-check the project as a
      # whole, so a type error in code no test imports would otherwise reach
      # master.
      - name: Type-check
        working-directory: backend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: backend
        run: npm run lint

      - name: Test
        working-directory: backend
        run: npm test

  frontend:
    name: Frontend — Vitest and build
    runs-on: ubuntu-latest
    # 39 files / 310 tests measured at 15s locally, plus install and the build.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          # See the backend job's identical comment: `npm ci` from frontend/
          # resolves against the root lockfile once packages/wire exists.
          cache-dependency-path: package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build @ge/wire
        working-directory: frontend
        run: npm run build --workspace @ge/wire

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Test
        working-directory: frontend
        run: npm test

      # `npm run build` is `tsc && vite build`, so this is the frontend's
      # type-check as well as proof the bundle still assembles.
      #
      # THE PLAYWRIGHT SPECS UNDER e2e/ ARE DELIBERATELY NOT RUN HERE, decided
      # 2026-09-10. They are excluded from Vitest already. Running them would
      # mean a migrated and seeded `ge` database, a backend started in the
      # background with GE_DEBUG_ENDPOINTS=1 for the fixtures they drive, and a
      # Chromium download — to exercise a real-time game on a 6-second tick,
      # single-worker, with 60-second per-test timeouts, against a freshly
      # generated 40,401-sector galaxy. That is a lot of moving parts for a
      # layer that runs perfectly well against the dev stack, which is where it
      # stays. Run it there with `npm run test:e2e`.
      - name: Build
        working-directory: frontend
        run: npm run build

  # Does anything in this push actually change what goes INTO an image?
  #
  # GIT_SHA is a build arg baked into both images, so every build produces a new
  # digest even when no code changed, watchtower sees a new :latest, and the
  # stack restarts. A test-only commit therefore interrupts whoever is playing,
  # and coverage work makes many such commits.
  #
  # Neither Dockerfile copies these paths — backend takes package*.json, prisma,
  # tsconfig, nest-cli.json, src and config; frontend takes package*.json, the
  # config files, index.html, src and nginx.conf. The two tools/ directories
  # hold the canon extractors and the coverage classifier, which run on a
  # developer's machine. Excluding them is safe BECAUSE the extractors write
  # their output into backend/src and backend/prisma/seed, which are not
  # excluded, so regenerating canon still deploys while editing the generator
  # that produced it does not.
  #
  # This file is NOT excluded. A change to the build recipe should rebuild:
  # that is the only way to learn whether the recipe still works.
  #
  # It FAILS OPEN. Whenever the range cannot be determined the answer is build,
  # because a redundant restart is recoverable and a deploy that silently did
  # not happen is not.
  changes:
    name: Build needed?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push'
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The push range starts at `before`, which is not in a shallow clone.
          fetch-depth: 0

      - id: decide
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -uo pipefail
          # `.githooks/` is here because hooks run on a developer's machine and
          # are never copied into a container. A push touching only those files
          # once spent a CI run and restarted a live game to publish a
          # byte-identical image. Pinned by test/unit/ci-build-inputs.spec.ts.
          #
          # Deliberately a SUPERSET of the paths-ignore on the trigger above.
          # The trigger only skips a push where EVERY file is ignored, so a
          # commit pairing a README with a test file would otherwise arrive here
          # and build. This list is the authority; the trigger is the shortcut.
          NOT_A_BUILD_INPUT='^(backend/test/|frontend/test/|frontend/e2e/|tools/|backend/tools/|docs/|specs/|\.githooks/|LICENSE$|NOTICE$)|\.md$'

          if [ -z "$BEFORE" ] \
            || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "Cannot resolve the push range from '$BEFORE' — building."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! CHANGED=$(git diff --name-only "$BEFORE" "$AFTER"); then
            echo "git diff failed across the range — building."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed in this push:"
          echo "$CHANGED" | sed 's/^/  /'

          RELEVANT=$(echo "$CHANGED" | grep -Ev "$NOT_A_BUILD_INPUT" || true)
          if [ -n "$RELEVANT" ]; then
            echo "Build inputs changed:"
            echo "$RELEVANT" | sed 's/^/  /'
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing here reaches an image. Skipping the build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build and publish images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # THE GATE. Both suites must pass before a single image is built. A pull
    # request never gets here, and neither does a push that changes nothing an
    # image contains.
    needs: [backend, frontend, changes]
    if: github.event_name == 'push' && needs.changes.outputs.build == 'true'

    permissions:
      contents: read
      packages: write

    strategy:
      # Build both even if one fails, so a broken frontend does not hide a
      # broken backend and cost a second round trip to find out.
      fail-fast: false
      matrix:
        include:
          - name: ge-backend
            context: .
            dockerfile: ./backend/Dockerfile
          - name: ge-frontend
            context: .
            dockerfile: ./frontend/Dockerfile

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # The release number lives in one place, at the repo root, so both images
      # cannot disagree about what release they are.
      - name: Read VERSION
        id: version
        run: echo "value=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Log in to ghcr
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          # Baked into the image so the running app can say which commit it is.
          # Same value as the :sha tag below, so a version on screen names a
          # pullable image, which is what makes it useful for rolling back.
          #
          # DONATE_URL comes from a repository variable rather than this file so
          # that a fork building its own image gets an empty value, and so no
          # button, instead of quietly shipping this repo's sponsor link.
          build-args: |
            GIT_SHA=${{ github.sha }}
            APP_VERSION=${{ steps.version.outputs.value }}
            DONATE_URL=${{ vars.DONATE_URL }}
          # The action defaults to provenance on when it pushes, and BuildKit's
          # Actions integration writes the whole push payload into the predicate
          # at invocation.environment.github_event_payload -- `pusher.email`
          # included. That address comes from the account's email setting rather
          # than from git, so the 2026-09-13 history rewrite did not touch it,
          # and `exporting attestation manifest` means the predicate rides along
          # on the image in ghcr, which goes public with the repository.
          #
          # mode=min was tried first and does NOT fix it: it trims the build
          # detail and leaves invocation.environment intact. Read the provenance
          # out of the build log of b6691b4 -- the commit that set mode=min --
          # and the payload is still there. Only `false` drops the attestation,
          # and the payload with it.
          #
          # What that costs is the SLSA attestation, which is worth little here:
          # GIT_SHA is already a build-arg on every image, so what is running
          # stays traceable without it.
          provenance: false
          # :latest is what watchtower follows; the sha tag is what makes a bad
          # deploy recoverable — pin the compose file to a sha to roll back.
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
