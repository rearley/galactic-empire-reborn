name: CI

# Runs the test suites. Nothing here builds or publishes an image — that is
# deploy.yml's job, and the two are deliberately separate.
#
# WHAT THIS DOES NOT DO YET: it does not gate the deploy. deploy.yml triggers on
# its own `push` to master, so a red run here does not stop an image reaching
# production. Wiring that up is a deliberate second step, because a broken gate
# blocks every deploy including the fix.
#
# TRIGGERS. `push` to master is the one that matters. Work on this repository is
# committed straight to master rather than through feature branches, so a
# pull_request-only workflow would almost never run. pull_request is here for
# the occasions when a branch is used.
#
# Documentation must not spend a CI run, for the same reason it must not restart
# a live game. The ignore list is deliberately SHORTER than deploy.yml's: that
# workflow also ignores backend/test, frontend/test and tools, because they are
# not build inputs. They are exactly what this workflow exists to run, so a
# change to any of them must trigger it.
on:
  push:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'specs/**'
      - 'LICENSE'
      - 'NOTICE'
  pull_request:
  workflow_dispatch:

# A newer commit supersedes an in-flight run on the same ref. Without this, a
# quick succession of pushes queues runs that are already answering a stale
# question.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Nothing here needs to write anything. deploy.yml holds packages:write because
# it pushes images; this workflow only reads the tree, so it says so explicitly
# rather than inheriting whatever the repository default happens to be.
permissions:
  contents: read

# Third-party actions are pinned to commit SHAs rather than tags, matching
# deploy.yml. A tag like @v4 is mutable. This workflow holds no secrets, so the
# stakes are lower here than there, but a consistent rule is easier to keep than
# a conditional one.

jobs:
  backend:
    name: Backend — Jest
    runs-on: ubuntu-latest
    # Measured at 100s wall clock for 605 suites / 6,141 tests on a developer
    # machine, plus install and schema push. A hosted runner is slower and its
    # Postgres is a container, so this is generous headroom rather than a
    # prediction. It exists so a hang costs minutes instead of the six-hour
    # default.
    timeout-minutes: 20

    # The suite is not hermetic: it runs against a real PostgreSQL, because the
    # queries under test are real Prisma queries. 16 matches production.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ge
          POSTGRES_PASSWORD: ge
          POSTGRES_DB: ge_test
        ports:
          - 5432:5432
        # Without a health check the first connection races container startup
        # and fails on a cold runner roughly one run in five.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # test/prisma-schema/helpers/global-setup.ts refuses to start without
      # this, so a stray run can never truncate a development database.
      TEST_DATABASE_URL: postgresql://ge:ge@localhost:5432/ge_test
      # AuthModule throws at construction when this is unset, which would fail
      # every auth and gateway suite. Value is irrelevant; it signs nothing that
      # outlives the job.
      JWT_SECRET: ci-not-a-real-secret
      # test/game/physics/bench.spec.ts asserts 100 ships advance in under 50ms.
      # It measured 3ms locally, but a wall-clock budget on a shared runner
      # tests the runner's neighbours, not this code. The escape hatch is the
      # test author's own.
      CI_LOW_PERF: '1'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # 20 to match both Dockerfiles. Testing on a newer major than production
      # runs would let a runtime difference through in the direction that
      # matters least.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # global-setup.ts shells out to `psql` for three LOWER() unique indexes
      # that Prisma cannot express in schema.prisma. The runner image ships a
      # client, but an assumption that fails silently three steps later is worse
      # than one that fails here.
      - name: Verify psql is present
        run: psql --version

      - name: Install
        working-directory: backend
        run: npm ci

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      # Jest transpiles per file and does not type-check the project as a whole,
      # so a type error in code no test imports would otherwise reach master.
      - name: Type-check
        working-directory: backend
        run: npx tsc --noEmit

      # globalSetup pushes the schema to the test database and creates the three
      # raw indexes before the first suite runs.
      - name: Test
        working-directory: backend
        run: npm test

  frontend:
    name: Frontend — Vitest and build
    runs-on: ubuntu-latest
    # Measured at 15s for 39 files / 310 tests, plus install and the Vite build.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Test
        working-directory: frontend
        run: npm test

      # `npm run build` is `tsc && vite build`, so this is the frontend's
      # type-check as well as proof the bundle still assembles. The Playwright
      # specs under e2e/ are excluded from Vitest and are not run here: they
      # need a live backend and a real browser, which is a separate job worth
      # adding on its own terms.
      - name: Build
        working-directory: frontend
        run: npm run build
