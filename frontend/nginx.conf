server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse proxy — auth, admin → backend.
    #
    # /debug/ is deliberately NOT proxied. Those routes are unauthenticated
    # cheat endpoints (teleport any ship, swap its hull, zero its damage, set
    # any captain's credits, spawn droids); proxying them put the whole set one
    # missing NODE_ENV away from the public internet. The dev workflow reaches
    # them directly on the backend port through the Vite proxy.
    location /auth/ {
        proxy_pass http://backend:3000/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /admin/ {
        proxy_pass http://backend:3000/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /public/ — the unauthenticated stats endpoint the landing and status
    # pages poll. Added 2026-09-08: it was missing, so a containerised frontend
    # served the status page and then 404'd on its own data. The page degrades
    # to "Status is unavailable right now." rather than erroring, which is
    # correct behaviour and also why nothing caught this.
    location /public/ {
        proxy_pass http://backend:3000/public/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # socket.io — supports both WebSocket upgrade and long-polling HTTP
    location /socket.io/ {
        proxy_pass http://backend:3000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
    }

    # SPA — all unmatched routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
