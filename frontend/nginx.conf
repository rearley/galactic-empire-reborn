server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Resolve the backend LAZILY, at request time, via a variable.
    #
    # With a literal `proxy_pass http://backend:3000`, nginx resolves the name
    # while PARSING the config and refuses to start if it fails — so this
    # container crash-looped on the deploy host, where the backend runs on host
    # networking and no `backend` name exists on this bridge. A container that
    # will not boot is a 502 on every page, including the ones that need no
    # backend at all.
    #
    # As a variable, nginx starts regardless and only tries to resolve when a
    # request actually arrives on one of these routes. In the deployed setup
    # none ever does: the panel's own nginx proxies /auth, /public and /socket.io
    # straight to the backend. Under plain docker-compose, `backend` resolves
    # and these work as before.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $ge_backend "backend:3000";

    # Reverse proxy — auth, admin → backend.
    #
    # /debug/ is deliberately NOT proxied. Those routes are unauthenticated
    # cheat endpoints (teleport any ship, swap its hull, zero its damage, set
    # any captain's credits, spawn droids); proxying them put the whole set one
    # missing NODE_ENV away from the public internet. The dev workflow reaches
    # them directly on the backend port through the Vite proxy.
    location /auth/ {
        proxy_pass http://$ge_backend/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /admin/ {
        proxy_pass http://$ge_backend/admin/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /public/ — the unauthenticated stats endpoint the landing and status
    # pages poll. Added 2026-09-08: it was missing, so a containerised frontend
    # served the status page and then 404'd on its own data. The page degrades
    # to "Status is unavailable right now." rather than erroring, which is
    # correct behaviour and also why nothing caught this.
    location /public/ {
        proxy_pass http://$ge_backend/public/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # socket.io — supports both WebSocket upgrade and long-polling HTTP
    location /socket.io/ {
        proxy_pass http://$ge_backend/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
    }

    # SPA — all unmatched routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
